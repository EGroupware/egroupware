name: EGroupware Testing

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
  # Lets a private repo run this exact same suite with its own apps checked out alongside the
  # public ones, instead of maintaining a second copy of it.
  # Private sources must never be checked out by this repo's own triggers, so they arrive purely
  # through the "extra-apps" input - see the "Checkout additional apps" step below.
  workflow_call:
    inputs:
      egw-repo:
        description: 'EGroupware repository to test.'
        type: string
        default: 'EGroupware/egroupware'
      egw-ref:
        description: >-
          Branch/tag/sha of egw-repo to test. Leave at master for day-to-day runs and pin a
          release tag (eg. 26.1) to verify an app against a release. Note this selects the code
          under test only - the steps themselves come from whichever ref the caller's "uses:"
          points at, so pin that too if a release needs its own CI setup.
        type: string
        default: 'master'
      extra-apps:
        description: >-
          JSON array of additional app repositories to check out into the tree, eg.
          [{"repo":"myorg/myrepo","dir":"myapp","ref":"master"}].
          "dir" defaults to the repository name, and is only needed where the app's directory
          differs from it. "ref" defaults to master.
          Their tests are picked up automatically: doc/phpunit.xml collects ../*/tests/ and
          web-test-runner.config.mjs builds a group per app from <app>/js/**/*.test.ts.
        type: string
        default: ''
      test-apps:
        description: >-
          Space-separated subset of the extra-apps directories whose tests should run.
          Defaults to every app in extra-apps. Only affects which tests run - every extra app is
          still checked out and installed, which is what lets an app that another one depends on
          be present without its suite being run.
        type: string
        default: ''
      test-scope:
        description: >-
          "all" (default) runs the whole suite. "extra-apps" still builds and installs the full
          instance, but then runs only the tests of the apps supplied via extra-apps - for
          callers who already know from the public repo's own CI whether the rest passed, and
          only need their own apps exercised inside a complete install.
        type: string
        default: 'all'
      extra-apps-owner:
        description: >-
          Organisation owning the extra-apps repositories. Required when
          authenticating via a GitHub App: this workflow file lives in another org, so without
          it the App installation would be looked up against the wrong owner.
        type: string
        default: ''
    secrets:
      # Two ways to authenticate against the extra-apps repositories - supply either.
      # A GitHub App is preferred: it mints a token scoped to just the repos it is installed on,
      # valid one hour, tied to the org rather than to a person's account. Its token is revoked
      # in the minting action's post step, so it can only be created inside the job that uses it
      # - which is why the minting happens here rather than in the calling workflow.
      extra-apps-app-id:
        description: 'GitHub App ID, used together with extra-apps-private-key.'
        required: false
      extra-apps-private-key:
        description: 'PEM private key of the GitHub App named by extra-apps-app-id.'
        required: false
      extra-apps-token:
        description: >-
          Fallback for installations without a GitHub App: a token with read access to every
          repository listed in extra-apps. Ignored when extra-apps-app-id is set.
        required: false

jobs:
  phpunit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EGW_DB_ROOT_PW: ciroot
      COMPOSE_PROJECT_NAME: egwci
      EGW_CI_ROOT: ${{ github.workspace }}/sources
      EGW_CI_DOCKER_DIR: ${{ github.workspace }}/sources/doc/docker
      EGW_SRC_DIR: /var/www
      EGW_CONFIG_USER: ""
      EGW_CONFIG_PASSWD: ""
      SYSOP_USER: ""
      SYSOP_PASS: ""
      EGW_EXTRA_APP_DIRS: ""
      EGW_TEST_APP_DIRS: ""
      # The secrets context is not available in a step's "if:", so route it through job env.
      EXTRA_APPS_APP_ID: ${{ secrets.extra-apps-app-id }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Under workflow_call the github context describes the *calling* repository, so a
          # cross-repo caller has to name what to test; direct triggers fall back to themselves.
          repository: ${{ inputs.egw-repo || github.repository }}
          ref: ${{ inputs.egw-ref || github.ref }}
          submodules: true
          path: sources

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-cache-${{ runner.os }}-${{ hashFiles('sources/composer.lock') }}
          restore-keys: |
            composer-cache-${{ runner.os }}-

      - name: Install PHP dependencies in sources
        shell: bash
        run: |
          set -euo pipefail
          COMPOSER_CACHE_DIR="${HOME}/.composer/cache"
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "${COMPOSER_CACHE_DIR}":/tmp/composer-cache \
            -v "${GITHUB_WORKSPACE}/sources":/app -w /app \
            -e COMPOSER_CACHE_DIR=/tmp/composer-cache \
            composer install --no-interaction --ignore-platform-reqs
          php "${GITHUB_WORKSPACE}/sources/install-cli.php" --git-apps pull

      - name: Mint installation token for additional apps
        id: extra-apps-app-token
        if: inputs.extra-apps != '' && env.EXTRA_APPS_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.extra-apps-app-id }}
          private-key: ${{ secrets.extra-apps-private-key }}
          # No "repositories": grants the token every repo the App is installed on for this owner.
          owner: ${{ inputs.extra-apps-owner }}

      - name: Checkout additional apps
        if: inputs.extra-apps != ''
        env:
          EXTRA_APPS: ${{ inputs.extra-apps }}
          TEST_APPS: ${{ inputs.test-apps }}
          GH_TOKEN: ${{ steps.extra-apps-app-token.outputs.token || secrets.extra-apps-token }}
        run: |
          set -euo pipefail
          # Credentials are optional: a public app repository clones fine without any, and a
          # private one fails on git's own "repository not found" which says enough. Requiring a
          # token here would lock out exactly the community apps this input exists to serve.
          AUTH=""
          if [ -n "$GH_TOKEN" ]; then
            AUTH="x-access-token:${GH_TOKEN}@"
          else
            echo "::notice::no extra-apps credentials supplied, cloning anonymously"
          fi
          DIRS=""
          while read -r app; do
            repo="$(jq -r '.repo' <<<"$app")"
            dir="$(jq -r '.dir // (.repo | split("/") | last)' <<<"$app")"
            ref="$(jq -r '.ref // "master"' <<<"$app")"
            echo "::group::$repo@$ref -> $dir"
            # A public app is normally provided by composer, pinned to composer.lock and
            # extracted without a .git (composer's source clone is blocked on the runner). To
            # test the app's own ref instead, that copy has to be replaced - which is why this
            # runs after "Install PHP dependencies in sources" rather than before it.
            if [ -d "$GITHUB_WORKSPACE/sources/$dir" ]; then
              echo "replacing the composer-provided $dir"
              rm -rf "$GITHUB_WORKSPACE/sources/$dir"
            fi
            git clone --depth 1 --branch "$ref" \
              "https://${AUTH}github.com/${repo}.git" \
              "$GITHUB_WORKSPACE/sources/$dir"
            # Drop the clone's .git: it keeps the token out of a stored remote url, and stops
            # "install-cli.php --git-apps pull" below from trying to update these apps.
            rm -rf "$GITHUB_WORKSPACE/sources/$dir/.git"
            echo "::endgroup::"
            DIRS="$DIRS $dir"
          done < <(jq -c '.[]' <<<"$EXTRA_APPS")
          DIRS="${DIRS# }"
          echo "EGW_EXTRA_APP_DIRS=$DIRS" >> "$GITHUB_ENV"

          # Which of those to actually test. Checking an app out and running its tests are
          # separate concerns: an app that only needs to be present so another one installs has
          # no reason to have its own suite run.
          TEST_DIRS="${TEST_APPS:-}"
          if [ -z "$TEST_DIRS" ]; then
            TEST_DIRS="$DIRS"
          else
            for app in $TEST_DIRS; do
              case " $DIRS " in
                *" $app "*) ;;
                *) echo "::error::test-apps names '$app', which is not in extra-apps"; exit 1;;
              esac
            done
          fi
          echo "testing: $TEST_DIRS"
          echo "EGW_TEST_APP_DIRS=$TEST_DIRS" >> "$GITHUB_ENV"

      - name: Install PHP dependencies of additional apps
        if: env.EGW_EXTRA_APP_DIRS != ''
        shell: bash
        run: |
          set -euo pipefail
          COMPOSER_CACHE_DIR="${HOME}/.composer/cache"
          # Only for apps the root project does NOT already require: those carry their own
          # vendor/ dir, same as a manual install, because their requirements are absent from the
          # root composer.lock.
          for dir in $EGW_EXTRA_APP_DIRS; do
            [ -f "$GITHUB_WORKSPACE/sources/$dir/composer.json" ] || continue
            # An app the root project requires already had its dependencies resolved into the root
            # vendor/, and its composer.json is the package's own definition rather than a manifest
            # to install from. Running composer there finds no lock, re-resolves everything from
            # scratch, and can fail on constraints the root lock had long since settled. It would
            # also leave an app-level vendor/, which api/src/autoload.php treats as a fallback
            # source of classes.
            pkg="$(jq -r '.name // empty' "$GITHUB_WORKSPACE/sources/$dir/composer.json")"
            if [ -n "$pkg" ] && jq -e --arg p "$pkg" '.packages[] | select(.name == $p)' \
                 "$GITHUB_WORKSPACE/sources/composer.lock" > /dev/null; then
              echo "::notice::$dir is provided by the root composer.lock as $pkg, skipping"
              continue
            fi
            echo "::group::composer install in $dir"
            docker run --rm --user "$(id -u):$(id -g)" \
              -v "${COMPOSER_CACHE_DIR}":/tmp/composer-cache \
              -v "${GITHUB_WORKSPACE}/sources/$dir":/app -w /app \
              -e COMPOSER_CACHE_DIR=/tmp/composer-cache \
              composer install --no-interaction --ignore-platform-reqs
            echo "::endgroup::"
          done

      - name: Prepare compose project layout
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/sources/doc/docker/data" "$GITHUB_WORKSPACE/sources/doc/docker/sessions"
          rm -f "$GITHUB_WORKSPACE/sources/doc/docker/data/header.inc.php"

      - name: Start CI containers
        run: |
          set -euo pipefail
          COMPOSE="docker compose --project-directory $GITHUB_WORKSPACE/sources \
            -f $GITHUB_WORKSPACE/sources/doc/docker/docker-compose.yml \
            -f $GITHUB_WORKSPACE/sources/doc/docker/docker-compose.ci.yml"
          $COMPOSE up -d --force-recreate db egroupware nginx

      - name: Wait for install
        run: |
          set -euo pipefail
          COMPOSE="docker compose --project-directory $GITHUB_WORKSPACE/sources \
            -f $GITHUB_WORKSPACE/sources/doc/docker/docker-compose.yml \
            -f $GITHUB_WORKSPACE/sources/doc/docker/docker-compose.ci.yml"

          MAX_WAIT=60
          WAIT_INTERVAL=5
          ELAPSED=0
          SUCCESS_MSG="EGroupware successful installed"

          echo "Waiting for database to be ready..."
          until $COMPOSE exec -T db mariadb-admin ping -h "db" --silent --user=root --password="$EGW_DB_ROOT_PW"; do
            if [ "$ELAPSED" -ge "$MAX_WAIT" ]; then
              echo "::error::Timed out waiting for EGroupware installation"
              echo "==== egroupware logs ===="
              $COMPOSE logs egroupware || true
              echo "==== database logs ===="
              $COMPOSE logs db || true
              exit 1
            fi
            echo "  ... waiting for DB"
            sleep "$WAIT_INTERVAL"
            ELAPSED=$((ELAPSED + WAIT_INTERVAL))
          done

          echo "Waiting for EGroupware installation log message..."
          INSTALL_LOG="$(mktemp)"
          until $COMPOSE logs egroupware > "$INSTALL_LOG" && grep -q "$SUCCESS_MSG" "$INSTALL_LOG"; do
            if [ "$ELAPSED" -ge "$MAX_WAIT" ]; then
              echo "::error::Timed out waiting for EGroupware installation"
              echo "==== egroupware logs ===="
              $COMPOSE logs egroupware || true
              echo "==== database logs ===="
              $COMPOSE logs db || true
              exit 1
            fi

            sleep "$WAIT_INTERVAL"
            ELAPSED=$((ELAPSED + WAIT_INTERVAL))
            echo "  ... still waiting (${ELAPSED}s)"
          done

          $COMPOSE exec -T egroupware ln -sf /var/lib/egroupware/header.inc.php "$EGW_SRC_DIR/header.inc.php"

      - name: Extract install credentials
        run: |
          set -euo pipefail
          COMPOSE="docker compose --project-directory $GITHUB_WORKSPACE/sources \
            -f $GITHUB_WORKSPACE/sources/doc/docker/docker-compose.yml \
            -f $GITHUB_WORKSPACE/sources/doc/docker/docker-compose.ci.yml"

          INSTALL_LOG="$(mktemp)"
          $COMPOSE logs egroupware > "$INSTALL_LOG"

          # Get sysop admin user from install log
          SYSOP_USER="sysop"
          SYSOP_PASS="$(
            awk '
              /EGroupware username: sysop/ {found=1; next}
              found && /password:/ {
                sub(/^[^:]*:[[:space:]]*/, "", $0)
                print
                exit
              }
            ' "$INSTALL_LOG"
          )"

          # Get setup user/password from install log.
          CONFIG_USER="$(
            awk '
              /Setup username:/ {sub(/.*Setup username:[[:space:]]*/, "", $0); print; exit}
            ' "$INSTALL_LOG"
          )"
          CONFIG_PASS="$(
            awk '
              /Setup username:/ {found=1; next}
              found && /password:/ {
                sub(/^[^:]*:[[:space:]]*/, "", $0)
                print
                exit
              }
            ' "$INSTALL_LOG"
          )"
          for v in SYSOP_USER SYSOP_PASS CONFIG_USER CONFIG_PASS; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing $v"
              exit 1
            fi
          done
          {
            echo "SYSOP_USER=$SYSOP_USER"
            echo "SYSOP_PASS=$SYSOP_PASS"
            echo "EGW_CONFIG_USER=$CONFIG_USER"
            echo "EGW_CONFIG_PASSWD=$CONFIG_PASS"
          } >> "$GITHUB_ENV"

      - name: Debug admin-cli path mapping
        run: |
          set -euo pipefail
          COMPOSE="docker compose --project-directory $GITHUB_WORKSPACE/sources \
            -f $GITHUB_WORKSPACE/sources/doc/docker/docker-compose.yml \
            -f $GITHUB_WORKSPACE/sources/doc/docker/docker-compose.ci.yml"

          echo "== Host checks =="
          pwd
          ls -la "$GITHUB_WORKSPACE/sources/admin/admin-cli.php" || true
          ls -la "$GITHUB_WORKSPACE/sources/admin" | sed -n '1,80p' || true

          echo "== Compose resolved mounts (egroupware service) =="
          docker compose --project-directory "$GITHUB_WORKSPACE/sources" \
            -f "$GITHUB_WORKSPACE/sources/doc/docker/docker-compose.yml" \
            -f "$GITHUB_WORKSPACE/sources/doc/docker/docker-compose.ci.yml" \
            config | sed -n '/egroupware:/,/db:/p'

          echo "== Container checks =="
          $COMPOSE exec -T egroupware sh -lc 'pwd; ls -la /var/www | sed -n "1,80p"; ls -la /var/www/admin | sed -n "1,80p" || true; ls -la /var/www/egroupware/admin | sed -n "1,80p" || true'
          $COMPOSE exec -T egroupware sh -lc 'test -f /var/www/admin/admin-cli.php && echo "admin-cli in /var/www" || true; test -f /var/www/egroupware/admin/admin-cli.php && echo "admin-cli in /var/www/egroupware" || true'

      - name: Detect app root in container
        run: |
          set -euo pipefail
          COMPOSE="docker compose --project-directory $GITHUB_WORKSPACE/sources \
            -f $GITHUB_WORKSPACE/sources/doc/docker/docker-compose.yml \
            -f $GITHUB_WORKSPACE/sources/doc/docker/docker-compose.ci.yml"

          APP_DIR="$(
            $COMPOSE exec -T egroupware sh -lc '
              if [ -f /var/www/admin/admin-cli.php ]; then
                echo /var/www
              elif [ -f /var/www/egroupware/admin/admin-cli.php ]; then
                echo /var/www/egroupware
              else
                exit 1
              fi
            '
          )"
          echo "EGW_SRC_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "Detected EGW_SRC_DIR=$APP_DIR"

      - name: Configure for phpunit test (apps, user)
        run: |
          set -euo pipefail
          COMPOSE="docker compose --project-directory $GITHUB_WORKSPACE/sources \
            -f $GITHUB_WORKSPACE/sources/doc/docker/docker-compose.yml \
            -f $GITHUB_WORKSPACE/sources/doc/docker/docker-compose.ci.yml"

          # Get test user from phpunit.xml
          EGW_TEST_USER="$(
            sed -n 's/.*<var name="EGW_USER" value="\([^"]*\)".*/\1/p' "$GITHUB_WORKSPACE/sources/doc/phpunit.xml"
          )"
          EGW_TEST_PASS="$(
            sed -n 's/.*<var name="EGW_PASSWORD" value="\([^"]*\)".*/\1/p' "$GITHUB_WORKSPACE/sources/doc/phpunit.xml"
          )"
          for v in SYSOP_USER SYSOP_PASS EGW_TEST_USER EGW_TEST_PASS; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing $v"
              exit 1
            fi
          done
          {
            echo "SYSOP_USER=$SYSOP_USER"
            echo "SYSOP_PASS=$SYSOP_PASS"
          } >> "$GITHUB_ENV"

          $COMPOSE exec -T -w "$EGW_SRC_DIR" egroupware php admin/admin-cli.php \
            --edit-user "$SYSOP_USER,$SYSOP_PASS,$EGW_TEST_USER,Test,User,$EGW_TEST_PASS,$EGW_TEST_USER@example.invalid"
          $COMPOSE exec -T -w "$EGW_SRC_DIR" egroupware php admin/admin-cli.php \
            --allow-app "$SYSOP_USER,$SYSOP_PASS,$EGW_TEST_USER,projectmanager"

          # No separate admin test account needed: "sysop" (SYSOP_USER/SYSOP_PASS, extracted
          # above from the install log) already has real admin rights from setup and is used
          # directly as EGW_ADMIN_USER/EGW_ADMIN_PASSWORD in the "Run PHPUnit" step below.
          # A dedicated "demoadmin"-style account previously used here collided with "demo" in
          # several apps' generous name-matching lookups (see doc/phpunit.xml).

          # Ensure share links resolve locally in CI
          $COMPOSE exec -T -w "$EGW_SRC_DIR" egroupware php setup/setup-cli.php \
            --config default,"$EGW_CONFIG_USER","$EGW_CONFIG_PASSWD",hostname=localhost,webserver_url=/egroupware

      - name: Debug web access
        run: |
          set -euo pipefail
          COMPOSE="docker compose --project-directory $GITHUB_WORKSPACE/sources \
            -f $GITHUB_WORKSPACE/sources/doc/docker/docker-compose.yml \
            -f $GITHUB_WORKSPACE/sources/doc/docker/docker-compose.ci.yml"
          
          docker compose exec nginx nginx -T || true
          docker compose exec nginx ss -lntp || true
          
          $COMPOSE exec -T egroupware sh -lc '
            which curl || apt-get update && apt-get install -y curl
            echo "Testing 'nginx' URL:"
            curl -I -v http://nginx/ || true
            echo
            echo "Listening ports:"
            ss -lntp || netstat -lntp || true
          '
      - name: Install/update all apps
        run: |
          set -euo pipefail
          COMPOSE="docker compose --project-directory $GITHUB_WORKSPACE/sources \
            -f $GITHUB_WORKSPACE/sources/doc/docker/docker-compose.yml \
            -f $GITHUB_WORKSPACE/sources/doc/docker/docker-compose.ci.yml"

          # header.inc.php is generated against the image's own baked-in /usr/share/egroupware
          # install, while everything from here on serves the checked-out tree from $EGW_SRC_DIR.
          # Without patching EGW_SERVER_ROOT first, setup-cli.php scans the stale baked-in app
          # list, never sees the checkout's apps as new, and silently reports "No update
          # necessary". (Idempotent - "Run PHPUnit" below repeats it.)
          $COMPOSE exec -T egroupware \
            sed -i "s#/usr/share/egroupware#$EGW_SRC_DIR#g" /var/lib/egroupware/header.inc.php

          # The fixture app used by api/tests lives outside the app dirs - link it into place so
          # the loop below finds it like any other app.
          $COMPOSE exec -T -w "$EGW_SRC_DIR" egroupware sh -lc '
            if [ -d api/tests/fixtures/apps/test ]; then ln -sfn api/tests/fixtures/apps/test test; fi
          '

          # Install/update every app present in the checkout instead of naming them here: the CI
          # image's baked-in install lags the branch (it predates eg. webauthn, whose schema was
          # therefore never created), and apps supplied via the "extra-apps" input are not in it
          # at all. One app failing to install must not abort the rest of the matrix, so each
          # exit code is only logged; the app list queried afterwards is what actually gates.
          APPS="$(
            $COMPOSE exec -T -w "$EGW_SRC_DIR" egroupware sh -lc '
              for d in */setup/setup.inc.php; do [ -e "$d" ] && echo "${d%%/*}"; done
            ' | tr -d "\r"
          )"
          for app in $APPS; do
            echo "::group::setup-cli --update $app"
            set +e
            $COMPOSE exec -T -w "$EGW_SRC_DIR" egroupware \
              php setup/setup-cli.php --update \
                default,"$EGW_CONFIG_USER","$EGW_CONFIG_PASSWD",no,"$app"
            echo "setup-cli exit code for $app: $?"
            set -e
            echo "::endgroup::"
          done

          INSTALLED="$(
            $COMPOSE exec -T db mariadb -N -B -u root -p"$EGW_DB_ROOT_PW" -D "egroupware" \
              -e "SELECT app_name FROM egw_applications;" | tr -d "\r"
          )"
          echo "Installed apps: $(echo $INSTALLED | tr '\n' ' ')"

          # webauthn plus anything the caller asked for must be there, or the suite would silently
          # skip/fail on a missing schema rather than report it here.
          for app in webauthn ${EGW_EXTRA_APP_DIRS:-}; do
            if ! grep -qx "$app" <<<"$INSTALLED"; then
              echo "::error::app '$app' missing from egw_applications after install"
              exit 1
            fi
          done
          # The fixture app is only a warning: a checkout without api/tests/fixtures has none.
          if ! grep -qx "test" <<<"$INSTALLED"; then
            echo "::warning::fixture app 'test' not installed, some tests will be skipped"
          fi

          # Name a missing dependency as such. An extra app whose setup.inc.php depends on an app
          # that is not installed otherwise fails somewhere inside its own tests, with nothing
          # pointing at the cause. This can only report it: setup.inc.php names an app but not the
          # repository to clone it from, so adding it to extra-apps is the caller's job.
          #
          # A warning rather than an error, deliberately. "depends" is not enforced at install time
          # and apps over-declare it - an app can list another as a dependency of the product
          # bundle while its code runs fine without it, guarding the optional integration. Failing
          # here would break such a setup over a declaration that is known not to be load-bearing.
          if [ -n "${EGW_EXTRA_APP_DIRS:-}" ]; then
            $COMPOSE exec -T \
              -e EGW_EXTRA_APP_DIRS="$EGW_EXTRA_APP_DIRS" \
              -e EGW_INSTALLED_APPS="$INSTALLED" \
              -w "$EGW_SRC_DIR" egroupware php -r '
                $installed = preg_split("/\s+/", trim(getenv("EGW_INSTALLED_APPS")), -1, PREG_SPLIT_NO_EMPTY);
                $missing = 0;
                foreach (preg_split("/\s+/", trim(getenv("EGW_EXTRA_APP_DIRS")), -1, PREG_SPLIT_NO_EMPTY) as $app)
                {
                    $file = "$app/setup/setup.inc.php";
                    if (!file_exists($file)) continue;
                    $setup_info = [];
                    include $file;
                    foreach ($setup_info[$app]["depends"] ?? [] as $dep)
                    {
                        $name = $dep["appname"];
                        if (!in_array($name, $installed, true))
                        {
                            fwrite(STDERR, "::warning::$app declares a dependency on $name, which is not installed - if its tests fail unexpectedly, add $name to the extra-apps input\n");
                            $missing++;
                        }
                    }
                }
                if ($missing) fwrite(STDERR, "$missing declared dependency/ies not installed\n");
              '
          fi

      - name: Disable swoolepush for CI tests
        run: |
          set -euo pipefail
          COMPOSE="docker compose --project-directory $GITHUB_WORKSPACE/sources \
            -f $GITHUB_WORKSPACE/sources/doc/docker/docker-compose.yml \
            -f $GITHUB_WORKSPACE/sources/doc/docker/docker-compose.ci.yml"
          $COMPOSE exec -T db mariadb -u root -p"$EGW_DB_ROOT_PW" -D "egroupware" -e \
            "UPDATE egw_applications SET app_enabled=-1 WHERE app_name='swoolepush';"
          $COMPOSE exec -T -w "$EGW_SRC_DIR" egroupware php -r '
            require "api/src/loader/common.php";
            \EGroupware\Api\Cache::unsetInstance(\EGroupware\Api\Egw\Applications::class, "apps");
            \EGroupware\Api\Cache::unsetInstance(\EGroupware\Api\Hooks::class, "locations");
          '

      - name: Run PHPUnit
        timeout-minutes: 30
        env:
          TEST_SCOPE: ${{ inputs.test-scope || 'all' }}
        run: |
          set -euo pipefail
          COMPOSE="docker compose --project-directory $GITHUB_WORKSPACE/sources \
            -f $GITHUB_WORKSPACE/sources/doc/docker/docker-compose.yml \
            -f $GITHUB_WORKSPACE/sources/doc/docker/docker-compose.ci.yml"
          EGW_CONFIG_USER="${EGW_CONFIG_USER:-}"
          EGW_CONFIG_PASSWD="${EGW_CONFIG_PASSWD:-}"
          for v in EGW_CONFIG_USER EGW_CONFIG_PASSWD; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing $v"
              exit 1
            fi
          done

          # header.inc.php is generated against the image's own baked-in /usr/share/egroupware
          # install (rsynced from the image at container start), but the "Run PHPUnit" step below
          # serves the actual checked-out branch from $EGW_SRC_DIR instead - patch the mismatched
          # EGW_SERVER_ROOT so the app-specific autoloader (api/src/autoload.php, which resolves
          # classes via EGW_INCLUDE_ROOT rather than composer's own correctly-resolved base dir)
          # looks in the right place. Done inside the container (not via the host bind-mount path)
          # since the file is owned by the container's own user, not the Actions runner.
          $COMPOSE exec -T egroupware \
            sed -i "s#/usr/share/egroupware#$EGW_SRC_DIR#g" /var/lib/egroupware/header.inc.php

          # Narrow the run to the extra apps by generating a config with a single testsuite,
          # rather than by passing paths: phpunit takes only one positional path, and the <php>
          # vars plus the bootstrap in doc/phpunit.xml have to be preserved either way. Paths in
          # a phpunit config resolve against the config's own directory, hence the "../" prefix.
          PHPUNIT_CONFIG=doc/phpunit.xml
          if [ "$TEST_SCOPE" = "extra-apps" ]; then
            if [ -z "${EGW_TEST_APP_DIRS:-}" ]; then
              echo "::error::test-scope is 'extra-apps' but no extra-apps were supplied"
              exit 1
            fi
            PHPUNIT_CONFIG=doc/phpunit-extra-apps.xml
            $COMPOSE exec -T -e EGW_TEST_APP_DIRS="$EGW_TEST_APP_DIRS" \
              -w "$EGW_SRC_DIR" egroupware php -r '
                $doc = new DOMDocument();
                $doc->preserveWhiteSpace = false;
                $doc->formatOutput = true;
                $doc->load("doc/phpunit.xml");
                $suites = $doc->getElementsByTagName("testsuites")->item(0);
                while ($suites->firstChild) $suites->removeChild($suites->firstChild);
                $suite = $doc->createElement("testsuite");
                $suite->setAttribute("name", "ExtraApps");
                $found = 0;
                foreach (preg_split("/\s+/", trim(getenv("EGW_TEST_APP_DIRS")), -1, PREG_SPLIT_NO_EMPTY) as $app)
                {
                    if (!is_dir("$app/tests")) { fwrite(STDERR, "no tests/ in $app, skipped\n"); continue; }
                    $suite->appendChild($doc->createElement("directory", "../$app/tests/"));
                    $found++;
                }
                if (!$found) { fwrite(STDERR, "none of the extra apps has a tests/ directory\n"); exit(3); }
                $suites->appendChild($suite);
                $doc->save("doc/phpunit-extra-apps.xml");
                fwrite(STDERR, "generated doc/phpunit-extra-apps.xml with $found app(s)\n");
              '
          fi

          # Run tests with local HTTP endpoint inside egroupware container
          $COMPOSE exec -T \
            -e PHPUNIT_CONFIG="$PHPUNIT_CONFIG" \
            -e HTTP_HOST=127.0.0.1:8081 \
            -e HTTP_X_FORWARDED_PROTO=http \
            -e EGW_URL=http://127.0.0.1:8081 \
            -e EGW_CONFIG_USER="$EGW_CONFIG_USER" \
            -e EGW_CONFIG_PASSWD="$EGW_CONFIG_PASSWD" \
            -e EGW_ADMIN_PASSWORD="$SYSOP_PASS" \
            -w "$EGW_SRC_DIR" egroupware \
            bash -lc '
              set -euo pipefail
              php -S 127.0.0.1:8081 -t "$PWD" "$PWD/.github/ci-router.php" > /tmp/egw-phpunit-http.log 2>&1 &
              server_pid=$!
              trap "kill $server_pid 2>/dev/null || true" EXIT

              for i in $(seq 1 20); do
                php -r '\''$fp=@fsockopen("127.0.0.1",8081,$errno,$errstr,0.2); if($fp){fclose($fp); exit(0);} exit(1);'\'' && break
                sleep 1
              done
              set +e
              php vendor/bin/phpunit --configuration "$PHPUNIT_CONFIG"
              rc=$?
              set -e
              echo "=== php built-in server log (last 300 lines) ==="
              tail -n 300 /tmp/egw-phpunit-http.log || true
              exit $rc
            '
      - name: Tear down
        if: always()
        run: |
          COMPOSE="docker compose --project-directory $GITHUB_WORKSPACE/sources \
            -f $GITHUB_WORKSPACE/sources/doc/docker/docker-compose.yml \
            -f $GITHUB_WORKSPACE/sources/doc/docker/docker-compose.ci.yml"
          $COMPOSE down -v --remove-orphans

  jstest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EGW_DB_ROOT_PW: ciroot
      COMPOSE_PROJECT_NAME: egwci
      EGW_CI_ROOT: ${{ github.workspace }}/sources
      EGW_CI_DOCKER_DIR: ${{ github.workspace }}/sources/doc/docker
      EGW_SRC_DIR: /var/www
      EGW_CONFIG_USER: ""
      EGW_CONFIG_PASSWD: ""
      SYSOP_USER: ""
      SYSOP_PASS: ""
      EGW_EXTRA_APP_DIRS: ""
      EGW_TEST_APP_DIRS: ""
      # The secrets context is not available in a step's "if:", so route it through job env.
      EXTRA_APPS_APP_ID: ${{ secrets.extra-apps-app-id }}
    defaults:
      run:
        shell: bash
        working-directory: sources
    steps:
      - uses: actions/checkout@v4
        with:
          # Under workflow_call the github context describes the *calling* repository, so a
          # cross-repo caller has to name what to test; direct triggers fall back to themselves.
          repository: ${{ inputs.egw-repo || github.repository }}
          ref: ${{ inputs.egw-ref || github.ref }}
          submodules: true
          path: sources

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-cache-${{ runner.os }}-${{ hashFiles('sources/composer.lock') }}
          restore-keys: |
            composer-cache-${{ runner.os }}-

      - name: Install PHP dependencies in sources
        shell: bash
        run: |
          set -euo pipefail
          COMPOSER_CACHE_DIR="${HOME}/.composer/cache"
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "${COMPOSER_CACHE_DIR}":/tmp/composer-cache \
            -v "${GITHUB_WORKSPACE}/sources":/app -w /app \
            -e COMPOSER_CACHE_DIR=/tmp/composer-cache \
            composer install --no-interaction --ignore-platform-reqs

      - name: Mint installation token for additional apps
        id: extra-apps-app-token
        if: inputs.extra-apps != '' && env.EXTRA_APPS_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.extra-apps-app-id }}
          private-key: ${{ secrets.extra-apps-private-key }}
          # No "repositories": grants the token every repo the App is installed on for this owner.
          owner: ${{ inputs.extra-apps-owner }}

      - name: Checkout additional apps
        if: inputs.extra-apps != ''
        env:
          EXTRA_APPS: ${{ inputs.extra-apps }}
          TEST_APPS: ${{ inputs.test-apps }}
          GH_TOKEN: ${{ steps.extra-apps-app-token.outputs.token || secrets.extra-apps-token }}
        run: |
          set -euo pipefail
          # Credentials are optional: a public app repository clones fine without any, and a
          # private one fails on git's own "repository not found" which says enough. Requiring a
          # token here would lock out exactly the community apps this input exists to serve.
          AUTH=""
          if [ -n "$GH_TOKEN" ]; then
            AUTH="x-access-token:${GH_TOKEN}@"
          else
            echo "::notice::no extra-apps credentials supplied, cloning anonymously"
          fi
          DIRS=""
          while read -r app; do
            repo="$(jq -r '.repo' <<<"$app")"
            dir="$(jq -r '.dir // (.repo | split("/") | last)' <<<"$app")"
            ref="$(jq -r '.ref // "master"' <<<"$app")"
            echo "::group::$repo@$ref -> $dir"
            # A public app is normally provided by composer, pinned to composer.lock and
            # extracted without a .git (composer's source clone is blocked on the runner). To
            # test the app's own ref instead, that copy has to be replaced - which is why this
            # runs after "Install PHP dependencies in sources" rather than before it.
            if [ -d "$GITHUB_WORKSPACE/sources/$dir" ]; then
              echo "replacing the composer-provided $dir"
              rm -rf "$GITHUB_WORKSPACE/sources/$dir"
            fi
            git clone --depth 1 --branch "$ref" \
              "https://${AUTH}github.com/${repo}.git" \
              "$GITHUB_WORKSPACE/sources/$dir"
            # Drop the clone's .git: it keeps the token out of a stored remote url, and stops
            # "install-cli.php --git-apps pull" below from trying to update these apps.
            rm -rf "$GITHUB_WORKSPACE/sources/$dir/.git"
            echo "::endgroup::"
            DIRS="$DIRS $dir"
          done < <(jq -c '.[]' <<<"$EXTRA_APPS")
          DIRS="${DIRS# }"
          echo "EGW_EXTRA_APP_DIRS=$DIRS" >> "$GITHUB_ENV"

          # Which of those to actually test. Checking an app out and running its tests are
          # separate concerns: an app that only needs to be present so another one installs has
          # no reason to have its own suite run.
          TEST_DIRS="${TEST_APPS:-}"
          if [ -z "$TEST_DIRS" ]; then
            TEST_DIRS="$DIRS"
          else
            for app in $TEST_DIRS; do
              case " $DIRS " in
                *" $app "*) ;;
                *) echo "::error::test-apps names '$app', which is not in extra-apps"; exit 1;;
              esac
            done
          fi
          echo "testing: $TEST_DIRS"
          echo "EGW_TEST_APP_DIRS=$TEST_DIRS" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sources/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium firefox

      - name: Install Playwright Chromium
        timeout-minutes: 10
        env:
          DEBUG: pw:install
        run: npx playwright install chromium

      - name: Install Playwright Firefox
        timeout-minutes: 10
        env:
          DEBUG: pw:install
        run: npx playwright install firefox

      - name: Run jstest
        env:
          TEST_SCOPE: ${{ inputs.test-scope || 'all' }}
        run: |
          set -euo pipefail
          if [ "$TEST_SCOPE" != "extra-apps" ]; then
            npm run jstest
            exit $?
          fi
          # Positional globs become the runner's `files`, replacing the per-app groups it would
          # otherwise discover. Group *names* must not be passed positionally - the config throws
          # on that - so select by path instead, which also works for an app with no group yet.
          GLOBS=()
          for app in ${EGW_TEST_APP_DIRS:-}; do
            # bash has no globstar here, so probe with find rather than a ** glob
            if find "$app/js" -name '*.test.ts' -print -quit 2>/dev/null | grep -q .; then
              GLOBS+=("$app/js/**/*.test.ts")
            fi
          done
          if [ ${#GLOBS[@]} -eq 0 ]; then
            echo "::notice::no extra app has JS tests, nothing to run"
            exit 0
          fi
          npm run jstest -- "${GLOBS[@]}"
