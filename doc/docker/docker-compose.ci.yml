# Docker overrides for testing

services:
  egroupware:
    # Override name to avoid potential conflicts with dev containers
    container_name: egwci-egroupware
    restart: "no"
    ports: [ ]
    volumes:
      # Use the checked-out git sources
      - ${EGW_CI_ROOT:-../..}:/var/www
      # Current directory
      #- ${PWD}:/var/www
      - ${EGW_CI_DOCKER_DIR:-../../doc/docker}/data:/var/lib/egroupware
      - ${EGW_CI_DOCKER_DIR:-../../doc/docker}/sessions:/var/lib/php/sessions

  db:
    # Override name to avoid potential conflicts with dev containers
    container_name: egwci-egroupware-db
    restart: "no"
    # PHPUnit's LoggedInTest disconnects+reconnects once per test class (~100+ times across the
    # full suite, one long-lived CLI process) - MariaDB's stock default (151) was getting
    # exhausted mid-run ("Too many connections", found live 2026-11-17, CI run 44048453646),
    # cascading into every later test class failing identically. CI-only: raising this for a
    # real install isn't needed, the connection churn here is specific to the test harness.
    command: --max-connections=500
  nginx:
    volumes:
      - ${EGW_CI_ROOT}/doc/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  push:
    deploy:
      replicas: 0

  collabora-key:
    deploy:
      replicas: 0

  collabora-init:
    deploy:
      replicas: 0

  rocketchat:
    deploy:
      replicas: 0

  mongo:
    deploy:
      replicas: 0

  mongo-init-replica:
    deploy:
      replicas: 0

  watchtower:
    deploy:
      replicas: 0
