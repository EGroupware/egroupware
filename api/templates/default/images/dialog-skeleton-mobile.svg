<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none">
<!-- Phone version of dialog-skeleton.svg: edge to edge, one column of label + field rows, a short tab strip, a content
     area and two footer buttons.  Only the alpha matters, the colour comes from the theme (Framework::skeletonCss()). -->
<defs><filter id="b" x="-2%" y="-2%" width="104%" height="104%"><feGaussianBlur stdDeviation=".4"/></filter></defs>
<g filter="url(#b)" fill="#000">
<g fill-opacity=".5">
<rect x="4" y="3.6" width="22" height="1.6" rx=".8"/><rect x="30" y="3" width="52" height="2.8" rx=".8"/>
<rect x="4" y="9.6" width="18" height="1.6" rx=".8"/><rect x="30" y="9" width="64" height="2.8" rx=".8"/>
<rect x="4" y="15.6" width="24" height="1.6" rx=".8"/><rect x="30" y="15" width="64" height="2.8" rx=".8"/>
<rect x="4" y="21.6" width="20" height="1.6" rx=".8"/><rect x="30" y="21" width="64" height="2.8" rx=".8"/>
<rect x="4" y="27.6" width="22" height="1.6" rx=".8"/><rect x="30" y="27" width="64" height="2.8" rx=".8"/>
<rect x="30" y="35.4" width="16" height="1.6" rx=".8"/><rect x="52" y="35.4" width="18" height="1.6" rx=".8"/>
</g>
<g fill-opacity=".4"><rect x="4" y="40" width="92" height="46" rx="1.2"/></g>
<g fill-opacity=".8"><rect x="4" y="33" width="20" height="4.2" rx="1"/>
<rect x="4" y="90.5" width="44" height="5.5" rx="1.2"/><rect x="52" y="90.5" width="44" height="5.5" rx="1.2" fill-opacity=".5"/></g>
</g>
</svg>
